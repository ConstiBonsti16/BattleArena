<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-fullscreen">
<title>Battle Arena</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{background:#0d0d1a;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;min-height:100vh;overflow:hidden;touch-action:none}
#gc{display:block;cursor:crosshair;image-rendering:pixelated;touch-action:none;max-width:100vw}
#wrap{position:relative;width:100%;display:flex;flex-direction:column;align-items:center}
#ui{position:absolute;top:6px;left:6px;right:6px;pointer-events:none;display:flex;justify-content:space-between;gap:4px;flex-wrap:wrap}
.hud{background:rgba(0,0,0,0.7);border:1px solid rgba(255,255,255,0.12);border-radius:7px;padding:5px 8px;font-family:monospace;font-size:11px;color:#eee;min-width:80px}
.hb{width:70px;height:5px;background:#222;border-radius:3px;margin-top:2px}
.hf{height:5px;border-radius:3px}
#coins-hud{background:rgba(0,0,0,0.7);border:1px solid rgba(249,199,79,0.45);border-radius:7px;padding:5px 10px;font-family:monospace;font-size:13px;color:#f9c74f;font-weight:700;position:absolute;top:6px;left:50%;transform:translateX(-50%);white-space:nowrap}
#kill{position:absolute;bottom:6px;left:6px;pointer-events:none}
.klog{background:rgba(0,0,0,0.6);border-radius:5px;padding:2px 7px;font-family:monospace;font-size:10px;color:#f9c74f;margin-top:2px}
#roundend{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;pointer-events:none}
.rendcard{background:rgba(10,10,30,0.92);border:1px solid rgba(249,199,79,0.4);border-radius:14px;padding:20px 30px;text-align:center;font-family:monospace;pointer-events:all}
/* SHOP BAR */
#shopbar{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;justify-content:center;align-items:center;padding:0 4px;width:100%}
#shopbar button{font-size:11px;padding:5px 9px;border-radius:8px;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.07);color:#ddd;cursor:pointer;touch-action:manipulation}
#shopbar button:disabled{opacity:0.35;cursor:default}
.wpbtn.owned{border-color:#06d6a0!important;color:#06d6a0}
.wpbtn.active{background:rgba(6,214,160,0.18)!important;border-color:#06d6a0!important;color:#06d6a0}
#wpinfo{font-family:monospace;font-size:11px;color:#888;text-align:center;margin-top:3px;padding:0 6px}
/* BOTTOM BAR */
#btns{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap;justify-content:center;padding-bottom:8px}
#btns button{font-size:12px;padding:6px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.07);color:#ddd;cursor:pointer;touch-action:manipulation}
/* TOUCH JOYSTICK */
#joyzone{position:absolute;bottom:10px;right:10px;width:120px;height:120px;pointer-events:none}
#joybg{position:absolute;width:100px;height:100px;border-radius:50%;border:2px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.05);top:10px;left:10px}
#joystick{position:absolute;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,0.25);border:2px solid rgba(255,255,255,0.5);top:38px;left:38px;transition:none}
#shootbtn{position:absolute;bottom:10px;left:10px;width:70px;height:70px;border-radius:50%;background:rgba(230,57,70,0.5);border:2px solid rgba(230,57,70,0.8);color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;pointer-events:all;touch-action:manipulation;cursor:pointer}
#aimzone{position:absolute;top:0;left:0;width:100%;height:calc(100% - 0px);pointer-events:none}
</style>
</head>
<body>
<div id="wrap">
  <div style="position:relative;width:100%">
    <canvas id="gc"></canvas>
    <div id="ui"></div>
    <div id="kill"></div>
    <div id="coins-hud">🪙 0</div>
    <div id="roundend"></div>
    <div id="joyzone">
      <div id="joybg"></div>
      <div id="joystick"></div>
    </div>
    <div id="shootbtn">🔫</div>
    <div id="aimzone"></div>
  </div>
  <div id="shopbar"></div>
  <div id="wpinfo"></div>
  <div id="btns">
    <button id="btnStart">▶ Neues Spiel</button>
    <button id="btnBot">+ Bot</button>
    <button id="btnReset" style="border-color:#e63946;color:#e63946">🗑 Reset</button>
  </div>
</div>

<script>
const canvas = document.getElementById('gc');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  const maxW = Math.min(window.innerWidth, 720);
  const ratio = 680 / 400;
  W = maxW;
  H = Math.round(W / ratio);
  canvas.width = W;
  canvas.height = H;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
}
resize();
window.addEventListener('resize', () => { resize(); buildMap(); });

const PCOLORS = ['#e63946','#4cc9f0','#f9c74f','#06d6a0','#ff6b6b','#c77dff'];
const NAMES = ['Alpha','Bravo','Charlie','Delta','Echo','Foxx'];
const STORAGE_KEY = 'battle_arena_save_v2';

const WEAPONS = [
  {id:'pistol', name:'Pistole',emoji:'🔫',cost:0,  dmg:20,cd:20,speed:4,  bsize:3,spread:0,   burst:1,color:'#ffe066',desc:'Starter · ∞ Schüsse'},
  {id:'smg',    name:'SMG',    emoji:'⚡',cost:3,  dmg:12,cd:9, speed:4.5,bsize:2,spread:0.1, burst:1,color:'#4cc9f0',desc:'Schnellfeuer · 3 Coins'},
  {id:'shotgun',name:'Shotgun',emoji:'💥',cost:6,  dmg:18,cd:30,speed:3.5,bsize:3,spread:0.35,burst:5,color:'#f9c74f',desc:'5 Pellets · 6 Coins'},
  {id:'rifle',  name:'Rifle',  emoji:'🎯',cost:10, dmg:35,cd:25,speed:6,  bsize:3,spread:0,   burst:1,color:'#06d6a0',desc:'Präzise · 10 Coins'},
  {id:'minigun',name:'Minigun',emoji:'🌀',cost:18, dmg:10,cd:5, speed:4,  bsize:2,spread:0.15,burst:1,color:'#ff6b6b',desc:'Massiver DPS · 18 Coins'},
  {id:'rocket', name:'Rocket', emoji:'🚀',cost:25, dmg:60,cd:55,speed:3,  bsize:5,spread:0,   burst:1,color:'#c77dff',desc:'Explosion · 25 Coins'},
];

function loadSave(){
  try{const d=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');return{coins:d.coins||0,owned:d.owned||[0],weaponIdx:d.weaponIdx||0};}
  catch{return{coins:0,owned:[0],weaponIdx:0};}
}
function writeSave(coins,owned,weaponIdx){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify({coins,owned,weaponIdx}));}catch{}
}

let save=loadSave();
let humanCoins=save.coins;
let humanOwned=[...save.owned];
let humanWeaponIdx=save.weaponIdx;

let players=[],bullets=[],particles=[],killLog=[],frameId=null,gameRunning=false;
let mouseX=0,mouseY=0;
let joystickDX=0,joystickDY=0;

const walls=[];
function buildMap(){
  walls.length=0;
  const sx=W/680,sy=H/400;
  const raw=[
    {x:55,y:45,w:85,h:65,d:0.6},{x:215,y:28,w:65,h:75,d:0.4},{x:425,y:38,w:95,h:62,d:0.7},
    {x:555,y:55,w:85,h:75,d:0.3},{x:28,y:195,w:75,h:85,d:0.5},{x:155,y:155,w:105,h:58,d:0.8},
    {x:305,y:175,w:85,h:68,d:0.4},{x:475,y:185,w:72,h:85,d:0.6},{x:585,y:205,w:75,h:68,d:0.5},
    {x:75,y:305,w:90,h:62,d:0.7},{x:235,y:295,w:75,h:75,d:0.3},{x:395,y:315,w:95,h:58,d:0.6},
    {x:525,y:325,w:78,h:65,d:0.4}
  ];
  raw.forEach(b=>walls.push({x:b.x*sx,y:b.y*sy,w:b.w*sx,h:b.h*sy,d:b.d}));
}

function drawBuilding(b){
  ctx.fillStyle=`rgb(${Math.floor(55+25*b.d)},${Math.floor(52-15*b.d)},${Math.floor(48-8*b.d)})`;
  ctx.fillRect(b.x,b.y,b.w,b.h);
  ctx.strokeStyle='rgba(0,0,0,0.45)';ctx.lineWidth=1;ctx.strokeRect(b.x,b.y,b.w,b.h);
  const r=Math.floor(b.d*3);
  for(let i=0;i<r;i++){ctx.fillStyle='rgba(0,0,0,0.25)';ctx.fillRect(b.x+Math.random()*b.w,b.y+Math.random()*b.h,4+Math.random()*9,3+Math.random()*6);}
  const ww=Math.floor(b.w/26),wh=Math.floor(b.h/23);
  for(let wy=0;wy<wh;wy++)for(let wx=0;wx<ww;wx++){
    const px=b.x+7+wx*22,py=b.y+9+wy*20;
    if(px+10<b.x+b.w-4&&py+9<b.y+b.h-4){
      ctx.fillStyle=Math.random()<b.d*0.45?'rgba(30,22,15,0.8)':'rgba(90,130,170,0.35)';
      ctx.fillRect(px,py,10,9);
    }
  }
  if(b.d>0.5){ctx.fillStyle='rgba(70,50,35,0.55)';ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-4,b.y-8-b.d*10);ctx.lineTo(b.x+b.w*0.4,b.y-5-b.d*8);ctx.lineTo(b.x+b.w*0.4,b.y);ctx.fill();}
}

function drawGround(){
  ctx.fillStyle='#16213e';ctx.fillRect(0,0,W,H);
  for(let i=0;i<150;i++){ctx.fillStyle='rgba(255,255,255,0.025)';ctx.fillRect(Math.random()*W,Math.random()*H,1+Math.random()*2,1+Math.random()*2);}
  ctx.fillStyle='rgba(90,70,45,0.1)';
  for(let i=0;i<25;i++)ctx.fillRect(Math.random()*W,Math.random()*H,3+Math.random()*14,3+Math.random()*14);
}

function rectsOverlap(ax,ay,aw,ah,bx,by,bw,bh){return ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by;}
function collidesWall(x,y,r){return walls.some(w=>rectsOverlap(x-r,y-r,r*2,r*2,w.x,w.y,w.w,w.h));}

function scaleP(rx,ry){return{x:rx*(W/680),y:ry*(H/400)};}

function spawnPlayer(idx,human){
  const rawSpawns=[[60,370],[620,370],[340,25],[60,25],[620,25],[340,380]];
  const sp=scaleP(...rawSpawns[idx%6]);
  return{x:sp.x,y:sp.y,vx:0,vy:0,hp:100,maxHp:100,angle:0,
    color:PCOLORS[idx%PCOLORS.length],name:NAMES[idx%NAMES.length]+(human?' (Du)':''),
    human,dead:false,kills:0,shootCd:0,aiTarget:null,aiTimer:0,
    weaponIdx:human?humanWeaponIdx:0,ownedWeapons:human?[...humanOwned]:[0]};
}

function getWeapon(p){return WEAPONS[p.weaponIdx];}

function shoot(p){
  if(p.shootCd>0||p.dead)return;
  const w=getWeapon(p);
  for(let b=0;b<w.burst;b++){
    const ang=p.angle+(Math.random()-0.5)*w.spread*2;
    bullets.push({x:p.x,y:p.y,vx:Math.cos(ang)*w.speed,vy:Math.sin(ang)*w.speed,
      owner:p,life:130,trail:[],dmg:w.dmg,color:w.color,r:w.bsize,isRocket:w.id==='rocket'});
  }
  p.shootCd=w.cd;
  for(let i=0;i<3;i++)particles.push({x:p.x,y:p.y,vx:Math.cos(p.angle+0.5-Math.random())*2,vy:Math.sin(p.angle+0.5-Math.random())*2,life:10,color:w.color,r:2});
}

function explode(x,y,owner){
  for(let i=0;i<20;i++)particles.push({x,y,vx:(Math.random()-0.5)*5,vy:(Math.random()-0.5)*5,life:30,color:['#ff6b6b','#f9c74f','#ff9a00'][i%3],r:4});
  players.forEach(p=>{
    if(p===owner||p.dead)return;
    const d=Math.hypot(p.x-x,p.y-y);
    if(d<55){p.hp-=Math.floor(60*(1-d/55));if(p.hp<=0){p.dead=true;owner.kills++;onKill(owner,p);}}
  });
}

function onKill(killer,victim){
  if(killer.human){humanCoins+=killer.kills;syncSave();}
  addKillLog(killer,victim,killer.kills);
}

function syncSave(){
  const hp=players.find(p=>p.human);
  if(hp){humanOwned=[...hp.ownedWeapons];humanWeaponIdx=hp.weaponIdx;}
  writeSave(humanCoins,humanOwned,humanWeaponIdx);
}

function aiUpdate(p,dt){
  p.aiTimer-=dt;
  const alive=players.filter(q=>!q.dead&&q!==p);
  if(!alive.length)return;
  if(!p.aiTarget||p.aiTarget.dead||p.aiTimer<=0){p.aiTarget=alive[Math.floor(Math.random()*alive.length)];p.aiTimer=60+Math.random()*90;}
  const t=p.aiTarget,dx=t.x-p.x,dy=t.y-p.y,dist=Math.hypot(dx,dy);
  p.angle=Math.atan2(dy,dx)+(Math.random()-0.5)*0.3;
  const spd=0.3;
  if(dist>90){p.vx+=dx/dist*spd;p.vy+=dy/dist*spd;}else{p.vx-=dx/dist*0.25;p.vy-=dy/dist*0.25;}
  if(dist<240&&Math.random()<0.04)shoot(p);
  if(p.kills>=3&&!p.ownedWeapons.includes(1)){p.ownedWeapons.push(1);p.weaponIdx=1;}
  if(p.kills>=6&&!p.ownedWeapons.includes(2)){p.ownedWeapons.push(2);p.weaponIdx=2;}
  if(p.kills>=10&&!p.ownedWeapons.includes(3)){p.ownedWeapons.push(3);p.weaponIdx=3;}
}

let lastT=0;
function loop(t=0){
  const dt=Math.min((t-lastT)/16,3);lastT=t;
  ctx.clearRect(0,0,W,H);drawGround();walls.forEach(drawBuilding);
  const alive=players.filter(p=>!p.dead);
  if(alive.length<=1&&gameRunning){
    gameRunning=false;const winner=alive[0];syncSave();showRoundEnd(winner);updateHUD();renderShop();return;
  }
  players.forEach(p=>{
    if(p.dead)return;
    if(p.shootCd>0)p.shootCd-=dt;
    if(p.human){
      const spd=0.65;
      p.vx+=joystickDX*spd;
      p.vy+=joystickDY*spd;
      if(keys['ArrowLeft']||keys['a']||keys['A'])p.vx-=spd;
      if(keys['ArrowRight']||keys['d']||keys['D'])p.vx+=spd;
      if(keys['ArrowUp']||keys['w']||keys['W'])p.vy-=spd;
      if(keys['ArrowDown']||keys['s']||keys['S'])p.vy+=spd;
      if(aimActive){p.angle=Math.atan2(mouseY-p.y,mouseX-p.x);}
    } else aiUpdate(p,dt);
    p.vx*=0.78;p.vy*=0.78;
    let nx=p.x+p.vx*dt,ny=p.y+p.vy*dt;
    const r=8;
    if(!collidesWall(nx,p.y,r)&&nx>r&&nx<W-r)p.x=nx;else p.vx=0;
    if(!collidesWall(p.x,ny,r)&&ny>r&&ny<H-r)p.y=ny;else p.vy=0;
    const w=getWeapon(p);
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.angle);
    ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(0,0,8,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=w.color;ctx.fillRect(6,-2,12,4);
    if(w.id==='shotgun'){ctx.fillRect(14,-3,4,6);}
    else if(w.id==='rifle'){ctx.fillRect(6,-1.5,18,3);}
    else if(w.id==='minigun'){ctx.fillRect(6,-3,14,6);ctx.fillStyle='#555';ctx.fillRect(12,-1,5,2);}
    else if(w.id==='rocket'){ctx.fillRect(6,-2.5,15,5);ctx.fillStyle='#c77dff';ctx.beginPath();ctx.moveTo(21,0);ctx.lineTo(16,-4);ctx.lineTo(16,4);ctx.fill();}
    ctx.restore();
    if(p.human){ctx.strokeStyle='rgba(255,255,255,0.18)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(p.x,p.y,8,0,Math.PI*2);ctx.stroke();}
    ctx.fillStyle=p.color;ctx.font='9px monospace';ctx.textAlign='center';
    ctx.fillText(p.name.split(' ')[0],p.x,p.y-14);
    const hw=22*(p.hp/p.maxHp);
    ctx.fillStyle='#222';ctx.fillRect(p.x-11,p.y-22,22,4);
    ctx.fillStyle=p.hp>50?'#06d6a0':p.hp>25?'#f9c74f':'#e63946';ctx.fillRect(p.x-11,p.y-22,hw,4);
  });
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.trail.push({x:b.x,y:b.y});if(b.trail.length>7)b.trail.shift();
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    let hit=false;
    if(b.life<=0||b.x<0||b.x>W||b.y<0||b.y>H||collidesWall(b.x,b.y,b.r)){
      if(b.isRocket)explode(b.x,b.y,b.owner);
      else for(let p=0;p<4;p++)particles.push({x:b.x,y:b.y,vx:(Math.random()-0.5)*2,vy:(Math.random()-0.5)*2,life:10,color:'#666',r:2});
      bullets.splice(i,1);continue;
    }
    b.trail.forEach((pt,ti)=>{ctx.fillStyle=`rgba(${hexToRgb(b.color)},${0.08+0.1*ti})`;ctx.fillRect(pt.x-1,pt.y-1,3,3);});
    ctx.fillStyle=b.color;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();
    if(b.isRocket){ctx.fillStyle='rgba(255,150,50,0.6)';ctx.beginPath();ctx.arc(b.x-b.vx,b.y-b.vy,b.r+2,0,Math.PI*2);ctx.fill();}
    players.forEach(p=>{
      if(p===b.owner||p.dead||hit)return;
      if(Math.hypot(p.x-b.x,p.y-b.y)<10){
        if(b.isRocket){explode(b.x,b.y,b.owner);}
        else{
          p.hp-=b.dmg;
          for(let k=0;k<6;k++)particles.push({x:p.x,y:p.y,vx:(Math.random()-0.5)*4,vy:(Math.random()-0.5)*4,life:16,color:p.color,r:3});
          if(p.hp<=0){p.dead=true;b.owner.kills++;onKill(b.owner,p);}
        }
        hit=true;bullets.splice(i,1);
      }
    });
  }
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.88;p.vy*=0.88;p.life-=dt;
    ctx.globalAlpha=Math.max(0,p.life/20);
    ctx.fillStyle=p.color;ctx.fillRect(p.x-p.r/2,p.y-p.r/2,p.r,p.r);
    ctx.globalAlpha=1;
    if(p.life<=0)particles.splice(i,1);
  }
  updateHUD();
  frameId=requestAnimationFrame(loop);
}

const hexCache={};
function hexToRgb(h){
  if(hexCache[h])return hexCache[h];
  return hexCache[h]=`${parseInt(h.slice(1,3),16)},${parseInt(h.slice(3,5),16)},${parseInt(h.slice(5,7),16)}`;
}

function showRoundEnd(winner){
  const el=document.getElementById('roundend');
  const hp=players.find(p=>p.human);
  const isHuman=winner&&winner.human;
  const earned=hp?hp.kills:0;
  el.innerHTML=`<div class="rendcard">
    <div style="color:#f9c74f;font-size:20px;font-weight:700;font-family:monospace">${winner?(isHuman?'Du gewinnst!':winner.name.split(' ')[0]+' gewinnt!'):'Unentschieden!'}</div>
    <div style="color:#aaa;font-size:12px;font-family:monospace;margin:6px 0">${isHuman?'+ '+earned+' 🪙 Coins verdient!':'Deine Coins bleiben erhalten.'}</div>
    <div style="color:#f9c74f;font-size:14px;font-family:monospace;margin-bottom:12px">Gesamt: 🪙 ${humanCoins}</div>
    <button onclick="document.getElementById('roundend').innerHTML='';startGame(${players.filter(p=>!p.human).length})" style="font-size:14px;padding:8px 18px;border-radius:9px;border:1px solid #f9c74f;background:transparent;color:#f9c74f;cursor:pointer">▶ Nächste Runde</button>
  </div>`;
}

function addKillLog(killer,victim,coins){
  const bonus=coins>1?` +${coins}🪙`:'';
  killLog.unshift(killer.name.split(' ')[0]+' ⚡ '+victim.name.split(' ')[0]+(killer.human?bonus:''));
  if(killLog.length>4)killLog.pop();
  document.getElementById('kill').innerHTML=killLog.map(l=>`<div class="klog">${l}</div>`).join('');
}

function updateHUD(){
  document.getElementById('coins-hud').textContent='🪙 '+humanCoins;
  document.getElementById('ui').innerHTML=players.filter(p=>!p.dead).map(p=>`
    <div class="hud" style="border-color:${p.color}44">
      <div style="color:${p.color};font-weight:700;font-size:10px">${p.name.split(' ')[0]}${p.human?' ★':''}</div>
      <div style="color:#999;font-size:9px">❤${p.hp} ☠${p.kills} ${getWeapon(p).emoji}</div>
      <div class="hb"><div class="hf" style="width:${p.hp}%;background:${p.hp>50?'#06d6a0':p.hp>25?'#f9c74f':'#e63946'}"></div></div>
    </div>`).join('');
}

function renderShop(){
  const hp=players.find(p=>p.human);
  if(!hp)return;
  const bar=document.getElementById('shopbar');
  bar.innerHTML='<span style="font-size:10px;color:#888">Waffe:</span>';
  WEAPONS.forEach((w,i)=>{
    const owned=hp.ownedWeapons.includes(i);
    const active=hp.weaponIdx===i;
    const btn=document.createElement('button');
    btn.className='wpbtn'+(owned?' owned':'')+(active?' active':'');
    if(!owned){
      btn.textContent=`${w.emoji} ${w.name} [${w.cost}🪙]`;
      btn.disabled=humanCoins<w.cost;
      btn.onclick=()=>{if(humanCoins>=w.cost){humanCoins-=w.cost;hp.ownedWeapons.push(i);hp.weaponIdx=i;humanOwned=[...hp.ownedWeapons];humanWeaponIdx=i;syncSave();renderShop();}};
    } else {
      btn.textContent=`${w.emoji} ${w.name}${active?' ✓':''}`;
      btn.onclick=()=>{hp.weaponIdx=i;humanWeaponIdx=i;syncSave();renderShop();};
    }
    bar.appendChild(btn);
  });
  document.getElementById('wpinfo').textContent=`Aktiv: ${getWeapon(hp).emoji} ${getWeapon(hp).name} — ${getWeapon(hp).desc}`;
}

function startGame(bots){
  players=[];bullets=[];particles=[];killLog=[];
  buildMap();
  players.push(spawnPlayer(0,true));
  for(let i=0;i<bots;i++)players.push(spawnPlayer(i+1,false));
  gameRunning=true;
  document.getElementById('kill').innerHTML='';
  document.getElementById('roundend').innerHTML='';
  if(frameId)cancelAnimationFrame(frameId);
  loop();updateHUD();renderShop();
}

// ---- TOUCH JOYSTICK ----
const joystickEl=document.getElementById('joystick');
const joyzone=document.getElementById('joyzone');
let joyActive=false,joyId=null,joyOriginX=0,joyOriginY=0;
const JOY_R=40;

function updateJoystick(cx,cy){
  const rect=joyzone.getBoundingClientRect();
  const centerX=rect.left+rect.width/2;
  const centerY=rect.top+rect.height/2;
  let dx=cx-centerX,dy=cy-centerY;
  const dist=Math.hypot(dx,dy);
  if(dist>JOY_R){dx=dx/dist*JOY_R;dy=dy/dist*JOY_R;}
  joystickEl.style.left=(50+dx/rect.width*100-22/rect.width*50)+'px';
  joystickEl.style.top=(50+dy/rect.height*100-22/rect.height*50)+'px';
  joystickDX=dx/JOY_R;
  joystickDY=dy/JOY_R;
}

joyzone.style.pointerEvents='all';
joyzone.addEventListener('touchstart',e=>{
  e.preventDefault();
  const t=e.changedTouches[0];
  joyActive=true;joyId=t.identifier;
  updateJoystick(t.clientX,t.clientY);
},{passive:false});
joyzone.addEventListener('touchmove',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){if(t.identifier===joyId)updateJoystick(t.clientX,t.clientY);}
},{passive:false});
joyzone.addEventListener('touchend',e=>{
  for(const t of e.changedTouches){
    if(t.identifier===joyId){joyActive=false;joystickDX=0;joystickDY=0;joystickEl.style.left='38px';joystickEl.style.top='38px';}
  }
},{passive:false});

// ---- AIM ZONE (swipe on canvas to aim) ----
let aimActive=false,aimId=null;
const aimzone=document.getElementById('aimzone');
aimzone.style.pointerEvents='all';
aimzone.addEventListener('touchstart',e=>{
  e.preventDefault();
  const t=e.changedTouches[0];
  aimId=t.identifier;aimActive=true;
  const r=canvas.getBoundingClientRect();
  mouseX=t.clientX-r.left;mouseY=t.clientY-r.top;
},{passive:false});
aimzone.addEventListener('touchmove',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier===aimId){const r=canvas.getBoundingClientRect();mouseX=t.clientX-r.left;mouseY=t.clientY-r.top;}
  }
},{passive:false});
aimzone.addEventListener('touchend',e=>{
  for(const t of e.changedTouches){if(t.identifier===aimId){aimActive=false;}}
},{passive:false});

// ---- SHOOT BUTTON ----
document.getElementById('shootbtn').addEventListener('touchstart',e=>{
  e.preventDefault();
  const p=players.find(q=>q.human&&!q.dead);if(p)shoot(p);
},{passive:false});
document.getElementById('shootbtn').addEventListener('click',()=>{
  const p=players.find(q=>q.human&&!q.dead);if(p)shoot(p);
});

// ---- KEYBOARD ----
const keys={};
document.addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();});
document.addEventListener('keyup',e=>keys[e.key]=false);
canvas.addEventListener('mousemove',e=>{const r=canvas.getBoundingClientRect();mouseX=e.clientX-r.left;mouseY=e.clientY-r.top;});
canvas.addEventListener('mousedown',()=>{const p=players.find(q=>q.human&&!q.dead);if(p)shoot(p);});

document.getElementById('btnStart').addEventListener('click',()=>startGame(2));
document.getElementById('btnBot').addEventListener('click',()=>{if(!gameRunning){startGame(2);return;}if(players.length<6){players.push(spawnPlayer(players.length,false));updateHUD();}});
document.getElementById('btnReset').addEventListener('click',()=>{if(confirm('Wirklich alle Coins und Waffen zurücksetzen?')){humanCoins=0;humanOwned=[0];humanWeaponIdx=0;writeSave(0,[0],0);const hp=players.find(p=>p.human);if(hp){hp.ownedWeapons=[0];hp.weaponIdx=0;}updateHUD();renderShop();}});

buildMap();
startGame(2);
</script>
